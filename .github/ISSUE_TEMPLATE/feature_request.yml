name: Feature request
description: Explain a task you cannot complete today.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the user task and the current obstacle, with an example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change or workaround
      description: Keep the request focused. A request is not a promise of implementation.
  - type: textarea
    id: scope
    attributes:
      label: Deployment and client
      description: Which client and deployment would use this? Does it require new credentials, services, or permissions? Do not include credentials themselves.
