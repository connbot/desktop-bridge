name: Record personal capability demo
on:
  workflow_dispatch:
    inputs:
      coding_permission_mode:
        description: 'Permission mode for this disposable sample-data container; dangerous also disables filesystem confinement'
        type: choice
        options: [safe, trusted, dangerous]
        default: safe
permissions:
  contents: read
concurrency:
  group: personal-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRIDGE_CODING_PERMISSION_MODE: ${{ inputs.coding_permission_mode || 'safe' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the real Agent Workspace runtime
        run: docker build -t desktop-bridge:demo .
      - name: Start an isolated sample-data desktop
        run: |
          docker run -d --name bridge --shm-size=1g -p 127.0.0.1:8080:8080 \
            -e BRIDGE_OWNER_TOKEN=test-only-owner-token-not-for-deployment-123 \
            -e BRIDGE_PUBLIC_URL=http://127.0.0.1:8080 \
            -e BRIDGE_CODING_PERMISSION_MODE desktop-bridge:demo
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs bridge
          exit 1
      - name: Install the deterministic capture client
        run: |
          pip install 'httpx==0.28.1' 'mcp==1.29.0' 'playwright==1.62.0' 'Pillow==12.2.0'
          playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Record real MCP calls, generated files and headed Chromium
        run: python scripts/capture_personal_demo.py
      - name: Encode a shareable video and preserve evidence
        run: |
          ffmpeg -y -i artifacts/personal-demo/personal-capability-demo.webm \
            -c:v libx264 -crf 18 -preset fast -pix_fmt yuv420p -movflags +faststart \
            artifacts/personal-demo/personal-capability-demo.mp4
      - name: Collect runtime logs
        if: always()
        run: mkdir -p artifacts/personal-demo && docker logs bridge > artifacts/personal-demo/container.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: personal-capability-demo
          path: artifacts/personal-demo/
          retention-days: 7
      - name: Stop the bounded test runtime
        if: always()
        run: docker rm -fv bridge || true
