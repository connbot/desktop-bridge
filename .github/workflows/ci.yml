name: Validate Agent Computer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -c constraints.txt -e '.[test,initializer]'
      - run: ruff check .
      - run: pytest -q
      - name: Initializer offline DOM integration
        if: matrix.python == '3.12'
        run: |
          npm --prefix initializer/ui ci --ignore-scripts
          python tests/initializer_dom.py
      - name: Viewer asynchronous state regressions
        run: node --test tests/viewer_state.test.cjs
  desktop-e2e:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build actual desktop image
        run: docker build -t desktop-bridge:test .
      - name: Start isolated test desktop
        run: |
          docker run -d --name bridge --shm-size=1g -p 127.0.0.1:8080:8080 \
            -e BRIDGE_OWNER_TOKEN=test-only-owner-token-not-for-deployment-123 \
            -e BRIDGE_PUBLIC_URL=http://127.0.0.1:8080 desktop-bridge:test
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs bridge
          exit 1
      - name: Install test client
        run: pip install 'httpx==0.28.1' 'mcp==1.29.0' 'playwright==1.62.0' 'Pillow==12.2.0'
      - run: playwright install --with-deps chromium
      - name: Real GUI, browser, coding, OAuth, takeover and viewer tests
        run: python scripts/e2e.py
      - name: Read-only setup diagnostics against the running desktop
        env:
          BRIDGE_OWNER_TOKEN: test-only-owner-token-not-for-deployment-123
        run: python scripts/doctor.py --running
      - name: Restart and verify persistence
        run: |
          docker restart bridge
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          python scripts/e2e.py --restart-check
      - name: Collect logs
        if: always()
        run: mkdir -p artifacts && docker logs bridge > artifacts/container.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.attempt }}
          path: artifacts/
          retention-days: 7
      - name: Clean up test container
        if: always()
        run: docker rm -f bridge || true
