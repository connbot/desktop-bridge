name: Validate optional Postgres context
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: context-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: bridge_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enable TLS on the disposable fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          openssl req -new -x509 -days 1 -nodes -newkey rsa:2048 \
            -subj '/CN=localhost' -keyout /tmp/bridge-fixture.key -out /tmp/bridge-fixture.crt
          docker cp /tmp/bridge-fixture.key "$POSTGRES_CONTAINER:/tmp/bridge-fixture.key"
          docker cp /tmp/bridge-fixture.crt "$POSTGRES_CONTAINER:/tmp/bridge-fixture.crt"
          docker exec --user root "$POSTGRES_CONTAINER" sh -c \
            'chown postgres:postgres /tmp/bridge-fixture.key /tmp/bridge-fixture.crt && chmod 600 /tmp/bridge-fixture.key'
          docker exec --user postgres "$POSTGRES_CONTAINER" psql -d bridge_fixture -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec --user postgres "$POSTGRES_CONTAINER" psql -d bridge_fixture -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/bridge-fixture.crt'"
          docker exec --user postgres "$POSTGRES_CONTAINER" psql -d bridge_fixture -c "ALTER SYSTEM SET ssl_key_file = '/tmp/bridge-fixture.key'"
          docker exec --user postgres "$POSTGRES_CONTAINER" psql -d bridge_fixture -c 'SELECT pg_reload_conf()'
      - name: Install optional driver and test dependencies
        run: pip install -c constraints.txt -e '.[test,postgres]'
      - name: Run unit tests and real transaction tests
        env:
          BRIDGE_TEST_POSTGRES_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/bridge_fixture?sslmode=require
        run: |
          ruff check .
          pytest -q
