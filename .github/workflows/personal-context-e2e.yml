name: Validate personal context UI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-context-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the real desktop runtime
        run: docker build -t desktop-bridge:context-test .
      - name: Install real MCP and browser test clients
        run: |
          pip install 'httpx==0.28.1' 'mcp==1.29.0' 'playwright==1.62.0' 'Pillow==12.2.0'
          playwright install --with-deps chromium
      - name: Start with no optional memory configured
        run: |
          docker run -d --name bridge-context --shm-size=1g -p 127.0.0.1:8080:8080 \
            -e BRIDGE_OWNER_TOKEN=test-only-owner-token-not-for-deployment-123 \
            -e BRIDGE_PUBLIC_URL=http://127.0.0.1:8080 \
            -e BRIDGE_CODING_PERMISSION_MODE=safe desktop-bridge:context-test
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs bridge-context
          exit 1
      - name: Verify optional-off behavior and working desktop/file tools
        run: python scripts/personal_context_e2e.py --disabled-check
      - name: Remove the optional-off fixture before creating the local fixture
        run: |
          mkdir -p artifacts/personal-context
          docker logs bridge-context > artifacts/personal-context/disabled-container.log 2>&1
          docker rm -fv bridge-context
      - name: Start disposable local-backend desktop in safe mode
        run: |
          docker run -d --name bridge-context --shm-size=1g -p 127.0.0.1:8080:8080 \
            -e BRIDGE_OWNER_TOKEN=test-only-owner-token-not-for-deployment-123 \
            -e BRIDGE_PUBLIC_URL=http://127.0.0.1:8080 \
            -e BRIDGE_CONTEXT_BACKEND=local \
            -e BRIDGE_CODING_PERMISSION_MODE=safe desktop-bridge:context-test
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs bridge-context
          exit 1
      - name: Exercise context tools, real UI forms, cancellation and portability
        run: python scripts/personal_context_e2e.py
      - name: Restart and verify exact context and artifact persistence
        run: |
          docker restart bridge-context
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          python scripts/personal_context_e2e.py --restart-check
      - name: Collect diagnostic logs
        if: always()
        run: |
          mkdir -p artifacts/personal-context
          docker logs bridge-context > artifacts/personal-context/container.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: personal-context-local-evidence
          path: artifacts/personal-context/
          retention-days: 7
      - name: Remove disposable runtime and data
        if: always()
        run: docker rm -fv bridge-context || true
