[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:window-manager]
command=/usr/bin/openbox
priority=20
autorestart=true

[program:vnc-control]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -nopw -forever -shared -xkb -noxdamage
priority=30
autorestart=true

[program:vnc-view]
command=/usr/bin/x11vnc -display :99 -rfbport 5901 -localhost -nopw -forever -shared -viewonly -noxdamage
priority=30
autorestart=true

[program:browser]
command=/usr/local/bin/start-browser
priority=40
autorestart=true
stopasgroup=true
killasgroup=true

[program:gateway]
command=/usr/local/bin/desktop-bridge
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
