# Offline template. Generate fly.toml with scripts/configure_fly.py.
# This does not create an app, volume, credentials, or a running agent loop.
app = "__APP_NAME__"
primary_region = "__REGION__"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"
  build-target = "fly"

  [build.args]
    BRIDGE_PYTHON_EXTRAS = "desktop,postgres"

[env]
  BRIDGE_PUBLIC_URL = "https://__APP_NAME__.fly.dev"
  BRIDGE_DATA = "/data"
  BRIDGE_CODING_PERMISSION_MODE = "safe"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
    [http_service.checks.headers]
      Host = "__APP_NAME__.fly.dev"

[[mounts]]
  source = "desktop_data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
