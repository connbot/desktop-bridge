[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-bridge"
version = "0.1.0"
description = "A single-user, observable computer-use MCP gateway"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mcp==1.29.0", "fastapi==0.141.1", "uvicorn[standard]==0.52.1",
  "httpx==0.28.1", "playwright==1.62.0", "Pillow==12.2.0",
  "python-multipart==0.0.22",
]
[project.optional-dependencies]
initializer = ["PyNaCl==1.6.2", "PyJWT[crypto]==2.15.1"]
postgres = ["psycopg[binary]==3.3.6"]
desktop = ["cua-computer-server[vnc]==0.3.46", "coding-tools-mcp @ https://github.com/connbot/coding-tools-mcp/archive/a2b802171bee1f990effa55f955efa2eddde4c59.tar.gz"]
# Running the complete test suite also exercises the optional initializer.
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.7",
  "PyNaCl==1.6.2", "PyJWT[crypto]==2.15.1"]
[project.scripts]
desktop-bridge = "desktop_bridge.app:main"
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["desktop_bridge", "desktop_bridge.*", "initializer"]
[tool.setuptools.package-data]
desktop_bridge = ["static/*"]
initializer = ["static/*", "licenses/*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
